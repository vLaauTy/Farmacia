<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Inicio')}"></head>

<body>
    <div class="app">
        <th:block th:replace="~{fragments/layout :: sidebar('inicio')}"></th:block>

        <main class="main">
            <div class="content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title" th:text="'Hola, ' + ${nombreCompleto}">Hola, Doctor</h1>
                        <p class="page-subtitle" id="fecha-hoy">Bienvenido a tu consultorio en SaludSync.</p>
                    </div>
                    <div class="actions">
                        <a th:href="@{/mis-turnos}" class="btn btn-primary">
                            <svg class="icon"><use href="/images/icons.svg#calendar"></use></svg> Ver mis turnos
                        </a>
                    </div>
                </div>

                <div class="grid grid-2">
                    <a th:href="@{/mis-turnos}" class="card quick-link">
                        <span class="stat-icon"><svg class="icon"><use href="/images/icons.svg#calendar"></use></svg></span>
                        <span>
                            <span class="ql-title">Mis turnos</span>
                            <span class="ql-desc" style="display:block">Próximas consultas, resumen semanal e historial</span>
                        </span>
                        <svg class="icon ql-arrow"><use href="/images/icons.svg#arrow-right"></use></svg>
                    </a>
                    <a th:href="@{/pacientes}" class="card quick-link">
                        <span class="stat-icon info"><svg class="icon"><use href="/images/icons.svg#file-text"></use></svg></span>
                        <span>
                            <span class="ql-title">Pacientes</span>
                            <span class="ql-desc" style="display:block">Datos de contacto e historial clínico</span>
                        </span>
                        <svg class="icon ql-arrow"><use href="/images/icons.svg#arrow-right"></use></svg>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script>
        const f = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('fecha-hoy').textContent = 'Hoy es ' + f + '.';
    </script>
</body>

</html>
