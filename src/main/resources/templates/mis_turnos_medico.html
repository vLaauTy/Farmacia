<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis turnos')}"></head>

<body>
    <div class="app">
        <th:block th:replace="~{fragments/layout :: sidebar('mis-turnos')}"></th:block>

        <main class="main">
            <div class="content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Mis turnos</h1>
                        <p class="page-subtitle">
                            <span th:text="${medico.nombre + ' ' + medico.apellido}">Dr.</span> ·
                            <span th:text="${medico.especialidad}">Especialidad</span> ·
                            <span th:text="${medico.horario}">Horario</span>
                        </p>
                    </div>
                </div>

                <section class="grid grid-4 mb-4" aria-label="Resumen semanal">
                    <div class="card stat">
                        <span class="stat-icon warning"><svg class="icon"><use href="/images/icons.svg#clock"></use></svg></span>
                        <div>
                            <div class="stat-label">Restantes esta semana</div>
                            <div class="stat-value" th:text="${turnosRestantesSemana}">0</div>
                        </div>
                    </div>
                    <div class="card stat">
                        <span class="stat-icon"><svg class="icon"><use href="/images/icons.svg#calendar"></use></svg></span>
                        <div>
                            <div class="stat-label">Semana actual</div>
                            <div class="stat-value" th:text="${turnosSemanaActual}">0</div>
                        </div>
                    </div>
                    <div class="card stat">
                        <span class="stat-icon info"><svg class="icon"><use href="/images/icons.svg#activity"></use></svg></span>
                        <div>
                            <div class="stat-label">Semana anterior</div>
                            <div class="stat-value" th:text="${turnosSemanaAnterior}">0</div>
                        </div>
                    </div>
                    <div class="card stat">
                        <span class="stat-icon success"><svg class="icon"><use href="/images/icons.svg#calendar-days"></use></svg></span>
                        <div>
                            <div class="stat-label">Total asignados</div>
                            <div class="stat-value" th:text="${#lists.size(turnos)}">0</div>
                        </div>
                    </div>
                </section>

                <section class="card" th:if="${not #lists.isEmpty(turnos)}">
                    <div class="toolbar">
                        <label class="search">
                            <span class="sr-only">Buscar paciente</span>
                            <svg class="icon"><use href="/images/icons.svg#search"></use></svg>
                            <input type="search" class="input" data-filter="agenda" placeholder="Buscar paciente o DNI">
                        </label>
                        <div class="seg" data-seg-for="agenda" role="group" aria-label="Período">
                            <button type="button" class="active" data-value="proximo">Próximos</button>
                            <button type="button" data-value="pasado">Pasados</button>
                            <button type="button" data-value="all">Todos</button>
                        </div>
                        <span class="toolbar-count" data-count-for="agenda"></span>
                    </div>

                    <div class="appt-list" id="agenda" data-group="proximo">
                        <div class="appt" data-row th:each="turno : ${turnos}"
                            th:data-fecha="${turno.anio + '-' + #numbers.formatInteger(turno.mes, 2) + '-' + #numbers.formatInteger(turno.dia, 2)}"
                            th:data-hora="${turno.hora}">
                            <div class="appt-date">
                                <div class="d" th:text="${turno.dia}">15</div>
                                <div class="m js-mes">&nbsp;</div>
                            </div>
                            <div style="min-width:0">
                                <div class="person-name">
                                    <span th:text="${turno.hora}" class="mono">10:30</span> ·
                                    <span th:text="${turno.paciente?.nombre + ' ' + turno.paciente?.apellido}">Paciente</span>
                                    <span class="js-estado"></span>
                                </div>
                                <div class="appt-meta" th:if="${turno.paciente}">
                                    <span><svg class="icon icon-sm"><use href="/images/icons.svg#id-card"></use></svg> <span th:text="'DNI ' + ${turno.paciente.dni}">DNI</span></span>
                                    <span><svg class="icon icon-sm"><use href="/images/icons.svg#phone"></use></svg> <span th:text="${turno.paciente.telefono}">Tel</span></span>
                                    <span class="js-dia"></span>
                                </div>
                            </div>
                            <a th:if="${turno.paciente}" th:href="@{'/pacientes/editar/' + ${turno.paciente.id}}" class="btn btn-sm btn-secondary">
                                <svg class="icon"><use href="/images/icons.svg#file-text"></use></svg> Historial
                            </a>
                        </div>
                        <div class="no-results empty" style="display:none;padding:32px">
                            <p style="margin:0">No hay turnos para mostrar con este filtro.</p>
                        </div>
                    </div>
                </section>

                <section class="card empty" th:if="${#lists.isEmpty(turnos)}">
                    <span class="empty-icon"><svg class="icon icon-lg"><use href="/images/icons.svg#calendar"></use></svg></span>
                    <h3>No tenés turnos asignados</h3>
                    <p>Cuando la administración agende turnos con vos, van a aparecer acá.</p>
                </section>
            </div>
        </main>
    </div>

    <script>
        (function () {
            const hoy = new Date();
            const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
            const hoyIso = iso(hoy);
            const fin = new Date(hoy);
            fin.setDate(hoy.getDate() + ((7 - hoy.getDay()) % 7));
            const finIso = iso(fin);

            const lista = document.getElementById('agenda');
            if (!lista) return;
            const items = Array.from(lista.querySelectorAll('.appt'));
            items.forEach(function (el) {
                const f = el.dataset.fecha;
                const d = new Date(f + 'T00:00');
                el.querySelector('.js-mes').textContent = d.toLocaleDateString('es-AR', { month: 'short' }).replace('.', '')
                    + (d.getFullYear() !== hoy.getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : '');
                el.querySelector('.js-dia') && (el.querySelector('.js-dia').textContent = d.toLocaleDateString('es-AR', { weekday: 'long' }));
                const est = el.querySelector('.js-estado');
                if (f < hoyIso) {
                    el.dataset.group = 'pasado';
                    el.classList.add('is-past');
                } else {
                    el.dataset.group = 'proximo';
                    if (f === hoyIso) est.innerHTML = ' <span class="badge badge-warning badge-dot">Hoy</span>';
                    if (f <= finIso) el.classList.add('is-week');
                }
            });
            // Próximos: el más cercano primero. Pasados: el más reciente primero
            const clave = i => i.dataset.fecha + ' ' + i.dataset.hora.padStart(5, '0');
            const vacio = lista.querySelector('.no-results');
            const proximos = items.filter(i => i.dataset.group === 'proximo').sort((a, b) => clave(a).localeCompare(clave(b)));
            const pasados = items.filter(i => i.dataset.group === 'pasado').sort((a, b) => clave(b).localeCompare(clave(a)));
            proximos.concat(pasados).forEach(i => lista.insertBefore(i, vacio));
        })();
    </script>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
