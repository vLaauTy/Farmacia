spring.application.name=Farmacia

# Base de datos H2 en archivo, relativa a la carpeta desde donde se ejecuta la app
spring.datasource.url=jdbc:h2:file:./data/farmaciadb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: crea o actualiza las tablas según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Cambiar a true para ver en consola las consultas SQL (útil para depurar)
spring.jpa.show-sql=false

# data.sql crea el usuario admin si no existe
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Servidor accesible desde otras PCs de la red local
server.port=8000
server.address=0.0.0.0

logging.level.com.zaxxer.hikari=WARN

# Correo SMTP: se configura con variables de entorno (ver .env.example)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
